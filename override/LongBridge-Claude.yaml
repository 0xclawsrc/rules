# ======================================================
# Stash 覆写文件 (Override) —— 长桥 Longbridge + Claude
# 用法：Stash → 覆写(Override) → 从 URL 添加 → 粘贴本文件 raw 链接
#       → 应用到当前配置 → 重新载入
# 更新日期：2026-06-14
# ======================================================
name: "长桥 + Claude 分流"
desc: "Longbridge 与 Claude/Anthropic 域名分流；自带「长桥 Longbridge」「Claude AI」两个策略组，默认跟随🚀 节点选择，可单独切换"

# 自带独立策略组：默认跟随主策略组「🚀 节点选择」，也可手动切到 DIRECT
proxy-groups:
  - name: 长桥 Longbridge
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT
  - name: Claude AI
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

rule-providers:
  LongBridge:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/0xclawsrc/rules/main/ruleset/LongBridge.list"
    path: ./ruleset/LongBridge.list
    interval: 86400
  Claude:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/0xclawsrc/rules/main/ruleset/Claude.list"
    path: ./ruleset/Claude.list
    interval: 86400

rules:
  - RULE-SET,LongBridge,长桥 Longbridge
  - RULE-SET,Claude,Claude AI
