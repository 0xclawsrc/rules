# ======================================================
# Stash 覆写文件 (Override) —— 长桥 Longbridge + Claude
# 用法：Stash → 覆写(Override) → 从 URL 添加 → 粘贴本文件 raw 链接
#       → 应用到当前配置 → 重新载入
# 分流策略组：🚀 节点选择（须与你配置 proxy-groups 中的组名一致，
#            不一致请直接改本文件最后的 RULE-SET 行）
# 更新日期：2026-06-14
# ======================================================

rule-providers:
  LongBridge:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/0xclawsrc/rules/main/ruleset/LongBridge.list"
    path: ./ruleset/LongBridge.list
    interval: 86400
  Claude:
    type: http
    behavior: classical
    format: text
    url: "https://raw.githubusercontent.com/0xclawsrc/rules/main/ruleset/Claude.list"
    path: ./ruleset/Claude.list
    interval: 86400

rules:
  - RULE-SET,LongBridge,🚀 节点选择
  - RULE-SET,Claude,🚀 节点选择
